services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unikosa-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    networks:
      - unikosa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: unikosa-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - unikosa-network
    depends_on:
      - app

  # Let's Encrypt certificates. Bootstrap with scripts/init-letsencrypt.sh;
  # this container then renews every 12h.
  certbot:
    image: certbot/certbot:latest
    container_name: unikosa-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - unikosa-network

  postgres:
    image: postgres:16-alpine
    container_name: unikosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unikosa
      POSTGRES_USER: unikosa
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unikosa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unikosa -d unikosa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unikosa-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - unikosa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unikosa-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    networks:
      - unikosa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unikosa-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    networks:
      - unikosa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  unikosa-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage:
  certbot_certs:
  certbot_webroot:
