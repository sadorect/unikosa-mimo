; Supervisor program — persistent queue worker for unikosa-mimo (national).
; Use this if the host manages workers with Supervisor (as several other apps
; on this server do). Install with root:
;
;   sudo cp deploy/supervisor-unikosa-mimo.conf /etc/supervisor/conf.d/unikosa-mimo-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status unikosa-mimo-worker:*
;
; After a deploy:  sudo supervisorctl restart unikosa-mimo-worker:*

[program:unikosa-mimo-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/unikosa/unikosa-mimo/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/home/unikosa/unikosa-mimo
user=deploy
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/home/unikosa/unikosa-mimo/storage/logs/worker.log
