; Supervisor program — Laravel scheduler for unikosa-mimo (national).
; Runs `schedule:work`, which invokes the scheduler every minute in the
; foreground (no crontab needed). This is what fires the daily DB backup
; (db:backup, 02:00), event digest, blog digest, and birthday reminders.
;
; Install with root:
;   sudo cp deploy/supervisor-unikosa-mimo-scheduler.conf /etc/supervisor/conf.d/unikosa-mimo-scheduler.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status unikosa-mimo-scheduler
;
; After a deploy:  sudo supervisorctl restart unikosa-mimo-scheduler

[program:unikosa-mimo-scheduler]
command=/usr/bin/php /home/unikosa/unikosa-mimo/artisan schedule:work
directory=/home/unikosa/unikosa-mimo
user=deploy
numprocs=1
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/unikosa/unikosa-mimo/storage/logs/scheduler.log
